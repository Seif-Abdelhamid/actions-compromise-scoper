[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actions-compromise-scoper"
version = "0.1.0"
description = "Offline incident scoping for compromised GitHub Actions (CVE-2025-30066, CVE-2025-30154)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Seif Abdelhamid"}]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
actions-scope = "scoper.cli:main"

[tool.setuptools]
packages = ["scoper", "scoper.data"]

[tool.setuptools.package-data]
"scoper.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "S108", "E501"]

[tool.bandit]
exclude_dirs = ["tests"]
