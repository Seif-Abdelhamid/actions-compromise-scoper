title: memdump.py Executed on a CI Runner (CVE-2025-30066 payload)
id: 0c7f6e2d-8a8b-4b62-9f5e-5d1f2a9c7e40
status: experimental
description: >
  Detects execution of memdump.py or a download of the payload gist, the indicators the
  advisory lists for the compromised tj-actions/changed-files commit that dumped the runner's
  memory (GHSA-mrrh-fwg8-r2c3). Requires process-creation telemetry from self-hosted or
  instrumented runners.
references:
  - https://github.com/advisories/GHSA-mrrh-fwg8-r2c3
author: Seif Abdelhamid
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1003.007
  - attack.t1195.002
logsource:
  category: process_creation
  product: linux
detection:
  selection_script:
    CommandLine|contains: 'memdump.py'
  selection_fetch:
    CommandLine|contains|all:
      - 'gist.githubusercontent.com'
      - 'nikitastupin'
  condition: 1 of selection_*
falsepositives:
  - An unrelated script that happens to be named memdump.py
level: high
